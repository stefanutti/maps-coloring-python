[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pentagon-kempe-verifier"
version = "0.1.0"
description = "Conservative finite abstraction of pentagonal Kempe boundary states"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kempe-verifier = "kempe.__main__:main"

[tool.setuptools.packages.find]
include = ["kempe*"]
